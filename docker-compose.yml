services:

  # ============================================================
  # MySQL Database (OneCare + Dedicated Chatbot Schema)
  # ============================================================
  db:
    image: mysql:8.4
    container_name: onecare-db
    restart: unless-stopped

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}

    ports:
      - "${DB_PORT:-3306}:3306"

    volumes:
      - mysql-data:/var/lib/mysql

      # Creates the dedicated chatbot schema and user
      # Only executes when MySQL initializes a fresh volume
      - ../onecare-chatbot/docker/mysql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - onecare-network


  # ============================================================
  # Redis Cache
  # ============================================================
  cache:
    image: redis:7-alpine
    container_name: onecare-cache
    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - onecare-network


  # ============================================================
  # Spring Boot Backend
  # ============================================================
  backend:
    build:
      context: ../onecare-backend
      dockerfile: Dockerfile

    container_name: onecare-backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver

      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      SPRING_SQL_INIT_MODE: always
      SPRING_SQL_INIT_SCHEMA_LOCATIONS: classpath:schema.sql

      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY}

      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Set BACKUP_ENCRYPTION_KEY in .env}
      BACKUP_STORAGE_DIR: /app/backups

      COLUMN_ENCRYPTION_KEY: ${COLUMN_ENCRYPTION_KEY:-}

      REDIS_HOST: cache
      REDIS_PORT: 6379

      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}

      PASSWORD_RESET_FRONTEND_BASE_URL: ${PASSWORD_RESET_FRONTEND_BASE_URL}
      FRONTEND_URL: ${PASSWORD_RESET_FRONTEND_BASE_URL}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS}

      # Internal Docker service communication
      CHATBOT_BASE_URL: http://chatbot:8000
      CHATBOT_SERVICE_TOKEN: ${CHATBOT_SERVICE_TOKEN:?CHATBOT_SERVICE_TOKEN is required}

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    volumes:
      - backup-data:/app/backups

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8080/actuator/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

    networks:
      - onecare-network


  # ============================================================
  # Chatbot Shared Storage Initialization
  # ============================================================
  chatbot-storage-init:
    build:
      context: ../onecare-chatbot
      dockerfile: Dockerfile

    container_name: onecare-chatbot-storage-init

    user: "0:0"

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        mkdir -p /app/storage/vectors /app/storage/faiss &&
        chown -R appuser:appuser /app/storage &&
        chmod -R u+rwX /app/storage &&
        echo "Chatbot storage permissions initialized successfully"

    volumes:
      - chatbot_storage:/app/storage

    restart: "no"

    networks:
      - onecare-network


  # ============================================================
  # Django Chatbot Database Migrations
  # ============================================================
  chatbot-migrate:
    build:
      context: ../onecare-chatbot
      dockerfile: Dockerfile

    container_name: onecare-chatbot-migrate

    environment:
      
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}

      # Dedicated chatbot database schema
      DB_NAME: ${CHATBOT_DB_NAME:?Set CHATBOT_DB_NAME in .env}
      DB_USER: ${CHATBOT_DB_USER:?Set CHATBOT_DB_USER in .env}
      DB_PASSWORD: ${CHATBOT_DB_PASSWORD:?Set CHATBOT_DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: "3306"

      # Main OneCare database user (if required by chatbot integration)
      MAIN_DB_USER: ${DB_USER}

      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,chatbot,backend}

      CHATBOT_SERVICE_TOKEN: ${CHATBOT_SERVICE_TOKEN:?CHATBOT_SERVICE_TOKEN is required}
      CHATBOT_STORAGE_DIR: /app/storage

    command:
      - python
      - manage.py
      - migrate

    volumes:
      - chatbot_storage:/app/storage

    depends_on:
      db:
        condition: service_healthy
      chatbot-storage-init:
        condition: service_completed_successfully

    restart: "no"

    networks:
      - onecare-network


  # ============================================================
  # Django Chatbot API
  # ============================================================
  chatbot:
    build:
      context: ../onecare-chatbot
      dockerfile: Dockerfile

    container_name: onecare-chatbot
    restart: unless-stopped

    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}

      DB_NAME: ${CHATBOT_DB_NAME:?Set CHATBOT_DB_NAME in .env}
      DB_USER: ${CHATBOT_DB_USER:?Set CHATBOT_DB_USER in .env}
      DB_PASSWORD: ${CHATBOT_DB_PASSWORD:?Set CHATBOT_DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: "3306"

      MAIN_DB_USER: ${DB_USER}

      # Django host configuration
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,chatbot,backend}

      DJANGO_DEBUG: "0"

      CHATBOT_SERVICE_TOKEN: ${CHATBOT_SERVICE_TOKEN:?CHATBOT_SERVICE_TOKEN is required}
      CHATBOT_STORAGE_DIR: /app/storage

      # LLM configuration
      LLM_PROVIDER: groq
      LLM_API_KEY: ${LLM_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}

      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}

      LLM_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "30"
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:?Set LLM_MAX_TOKENS in .env}
      LLM_TEMPERATURE: "0"
      LLM_CONNECT_TIMEOUT: "3"
      LLM_MAX_RETRIES: "1"

      CHAT_GENERATOR_CLASS: chat_pipeline.generation.LLMGenerator

      # Embedding configuration
      KB_EMBEDDING_LOCAL_FILES_ONLY: "false"
      KB_PRELOAD_EMBEDDER: "true"
      EMBEDDING_MODEL: intfloat/multilingual-e5-small

      # Knowledge base configuration
      KB_MAX_UPLOAD_BYTES: "10485760"
      KB_URL_ALLOWLIST: ${KB_URL_ALLOWLIST:-who.int,nhs.uk,cdc.gov}

      # Chat configuration
      CHAT_CONTEXT_CHUNKS: "4"
      CHAT_CONTEXT_CHARS_PER_CHUNK: "2500"
      CHAT_TRANSLATE_TAMIL_SEARCH: "true"
      CHAT_SEARCH_TIMEOUT_SECONDS: "15"

      # Logging
      CHAT_LOG_ENABLED: "true"
      CHAT_LOG_REDACT: "true"

    command:
      - gunicorn
      - onecare_chat.wsgi:application
      - --bind
      - 0.0.0.0:8000

    ports:
      - "127.0.0.1:${CHATBOT_PORT:-8000}:8000"

    volumes:
      - chatbot_storage:/app/storage

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as u; r = u.Request('http://127.0.0.1:8000/internal/health', headers={'Authorization': 'Bearer ' + os.environ['CHATBOT_SERVICE_TOKEN']}); u.urlopen(r, timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

    depends_on:
      chatbot-migrate:
        condition: service_completed_successfully

    networks:
      - onecare-network


  # ============================================================
  # Chatbot Background Document Ingestion Worker
  # ============================================================
  chatbot-ingestion-worker:
    build:
      context: ../onecare-chatbot
      dockerfile: Dockerfile

    container_name: onecare-chatbot-ingestion-worker
    restart: unless-stopped

    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}

      DB_NAME: ${CHATBOT_DB_NAME:?Set CHATBOT_DB_NAME in .env}
      DB_USER: ${CHATBOT_DB_USER:?Set CHATBOT_DB_USER in .env}
      DB_PASSWORD: ${CHATBOT_DB_PASSWORD:?Set CHATBOT_DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: "3306"

      MAIN_DB_USER: ${DB_USER}

      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,chatbot,backend}

      CHATBOT_SERVICE_TOKEN: ${CHATBOT_SERVICE_TOKEN:?Set CHATBOT_SERVICE_TOKEN in .env}
      CHATBOT_STORAGE_DIR: /app/storage

      # LLM configuration required for document ingestion
      LLM_API_KEY: ${LLM_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}

      LLM_PROVIDER: groq
      LLM_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "30"
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:?Set LLM_MAX_TOKENS in .env}

      CHAT_GENERATOR_CLASS: chat_pipeline.generation.LLMGenerator

      KB_EMBEDDING_LOCAL_FILES_ONLY: "false"
      KB_PRELOAD_EMBEDDER: "true"
      EMBEDDING_MODEL: intfloat/multilingual-e5-small

      KB_MAX_UPLOAD_BYTES: "10485760"
      KB_URL_ALLOWLIST: ${KB_URL_ALLOWLIST:-who.int,nhs.uk,cdc.gov}

    command:
      - python
      - manage.py
      - run_ingestion_worker
      - --interval
      - "5"

    volumes:
      - chatbot_storage:/app/storage

    depends_on:
      chatbot-migrate:
        condition: service_completed_successfully

    networks:
      - onecare-network


  # ============================================================
  # React/Vite Frontend
  # ============================================================
  frontend:
    build:
      context: ../onecare-frontend
      dockerfile: Dockerfile

    container_name: onecare-frontend
    restart: unless-stopped

    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    ports:
      - "${FRONTEND_PORT:-3000}:8080"

    volumes:
      - ../onecare-frontend:/app
      - /app/node_modules

    networks:
      - onecare-network


# ============================================================
# Persistent Volumes
# ============================================================
volumes:
  mysql-data:
    name: onecare-mysql-data

  chatbot_storage:
    name: onecare-chatbot-storage

  backup-data:
    name: onecare-backup-data


# ============================================================
# Internal Network
# ============================================================
networks:
  onecare-network:
    name: onecare-network
    driver: bridge
