services:

  # ============================================================
  # MySQL Database
  # ============================================================
  db:
    image: mysql:8.4
    container_name: onecare-db
    restart: unless-stopped

    # Same charset/collation as onecare-chatbot (Django expects utf8mb4_0900_ai_ci)
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "${DB_PORT}:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      # INFRA-03: creates the chatbot's dedicated schema (onecare_chatbot) and its
      # least-privilege user (chatbot_app) ONCE, on a fresh MySQL volume.
      # Runs only at first initialisation -> use `docker compose down -v` if the
      # volume predates this mount.
      - ../onecare-chatbot/docker/mysql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${DB_USER}",
          "-p${DB_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - onecare-network


  # ============================================================
  # Redis Cache
  # ============================================================
  cache:
    image: redis:7-alpine
    container_name: onecare-cache
    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - onecare-network


  # ============================================================
  # Spring Boot Backend
  # ============================================================
  backend:
    build:
      context: ../onecare-backend
      dockerfile: Dockerfile

    container_name: onecare-backend
    restart: unless-stopped

    environment:
      # DDP-#49 / AC1: the base application.properties is git-ignored (secrets
      # live only in .env), so a fresh clone must start with a PACKAGED
      # profile. The prod-like layer overrides this default to staging.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver

      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      SPRING_SQL_INIT_SCHEMA_LOCATIONS: classpath:schema.sql

      # Required: compose refuses to start the stack without these, naming the
      # variable but never its value (AC3). No defaults on purpose.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 32, see .env.example)}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY}

      # DDP-31: base64 AES-256-GCM key for backup archives; staging/prod
      # profiles fail startup without it (AC3). Same :? gate as JWT_SECRET.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Set BACKUP_ENCRYPTION_KEY in .env (openssl rand -base64 32, see .env.example)}
      BACKUP_STORAGE_DIR: /app/backups
      # AES-256 column-encryption key: no consumer yet, the variable flows
      # through until the encrypting module lands (empty = feature off).
      COLUMN_ENCRYPTION_KEY: ${COLUMN_ENCRYPTION_KEY:-}

      REDIS_HOST: cache
      REDIS_PORT: 6379

      # DDP-16: SMTP_* reach spring.mail.* through the active profile. An
      # unreachable gateway must NOT stop the stack - /actuator/health then
      # reports DEGRADED (HTTP 200, container stays healthy; AC4).
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

      PASSWORD_RESET_FRONTEND_BASE_URL: ${PASSWORD_RESET_FRONTEND_BASE_URL}
      # Every profile reads password-reset.frontend-base-url from FRONTEND_URL.
      FRONTEND_URL: ${PASSWORD_RESET_FRONTEND_BASE_URL}

      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS}
      # Python chatbot proxy (renamed from chatbot.url by the DDP-39 merge).
      CHATBOT_BASE_URL: http://chatbot:8000
      # chatbot.service-token=${CHATBOT_SERVICE_TOKEN} has no default in ANY
      # profile - the backend needs the same token the chatbot service gates.
      CHATBOT_SERVICE_TOKEN: ${CHATBOT_SERVICE_TOKEN:?Set CHATBOT_SERVICE_TOKEN in .env (min 32 chars, see .env.example)}


    ports:
      - "${BACKEND_PORT}:8080"

    volumes:
      # DDP-31: backup archives (backup.storage-dir) survive restarts/rebuilds.
      - backup-data:/app/backups

    # DDP-#49 / DKR-04 AC3: the backend exposes /actuator/health (permitAll).
    # DEGRADED (e.g. SMTP unreachable) maps to HTTP 200, so the container stays
    # healthy; MySQL/Redis failures return 503 and mark it unhealthy - only
    # those two gate the stack (AC4 / SDS 2.5.1). curl ships with temurin.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

    networks:
      - onecare-network


  # ============================================================
  # Django Chatbot
  # ============================================================
  chatbot:
    build:
      context: ../onecare-chatbot
      dockerfile: Dockerfile

    container_name: onecare-chatbot
    restart: unless-stopped

    environment:
      # INFRA-03: the chatbot owns a DEDICATED schema. db_config.py refuses to start
      # unless DB_NAME is onecare_chatbot and DB_USER is not the Spring Boot user/root.
      DB_NAME: ${CHATBOT_DB_NAME}
      DB_USER: ${CHATBOT_DB_USER}
      # Dev/CI password: must match 01_schemas_and_users.sql in the chatbot repo
      # (that script is what GRANTs this user its least-privilege rights).
      DB_PASSWORD: ${CHATBOT_DB_PASSWORD}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      MAIN_DB_USER: ${DB_USER}

      # settings.py: CHATBOT_SERVICE_TOKEN must be >= 32 characters (Spring Boot -> Django auth)
      # Fails fast with a clear message when the key is missing/empty instead of a Django traceback.
      CHATBOT_SERVICE_TOKEN: ${CHATBOT_SERVICE_TOKEN:?Set CHATBOT_SERVICE_TOKEN in .env (min 32 chars, see .env.example)}
      # FAISS index + uploaded PDFs, kept on a named volume instead of inside the container
      CHATBOT_STORAGE_DIR: /app/storage

      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      ALLOWED_HOSTS: chatbot,backend

    # Run Django migrations against the dedicated schema before serving
    command: sh -c "python manage.py migrate && gunicorn onecare_chat.wsgi:application --bind 0.0.0.0:8000"

    ports:
      - "127.0.0.1:${CHATBOT_PORT:-8000}:8000"

    volumes:
      - chatbot_storage:/app/storage

    healthcheck:
      # Live route is /internal/health (the old /api/chatbot/health/ URL was
      # never routed) and it requires the Spring Boot -> Django service token,
      # so the probe authenticates with the token already in this container's
      # environment. 401 (wrong token) or unreachable => unhealthy.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request as u; r = u.Request('http://127.0.0.1:8000/internal/health', headers={'Authorization': 'Bearer ' + os.environ['CHATBOT_SERVICE_TOKEN']}); u.urlopen(r, timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

    depends_on:
      db:
        condition: service_healthy

    networks:
      - onecare-network


  # ============================================================
  # React/Vite Frontend
  # ============================================================
  frontend:
    build:
      context: ../onecare-frontend
      dockerfile: Dockerfile

    container_name: onecare-frontend
    restart: unless-stopped

    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    ports:
      - "${FRONTEND_PORT}:3000"
    
    volumes:
      - ../onecare-frontend:/app
      - /app/node_modules

    networks:
      - onecare-network


# ============================================================
# Volumes
# ============================================================
volumes:
  mysql-data:
    name: onecare-mysql-data

  # FAISS index + uploaded PDFs for the chatbot
  chatbot_storage:
    name: onecare-chatbot-storage

  # DDP-31: backend backup archives (BACKUP_STORAGE_DIR=/app/backups)
  backup-data:
    name: onecare-backup-data


# ============================================================
# Network
# ============================================================
networks:
  onecare-network:
    name: onecare-network
    driver: bridge